default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  primary:
    <<: *default
    database: hermes_development
  cache:
    <<: *default
    database: hermes_development
  queue:
    <<: *default
    database: hermes_development

test:
  primary:
    <<: *default
    database: hermes_test
  cache:
    <<: *default
    database: hermes_test
  queue:
    <<: *default
    database: hermes_test

production:
  primary:
    <<: *default
    database: hermes_production
    host: <%= ENV.fetch("POSTGRES_HOST", "postgres-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
  cache:
    <<: *default
    database: hermes_production
    host: <%= ENV.fetch("POSTGRES_HOST", "postgres-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
  queue:
    <<: *default
    database: hermes_production
    host: <%= ENV.fetch("POSTGRES_HOST", "postgres-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
